name = "carbon-footprint-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Shared merchant -> NAICS cache. Create the namespace once:
#   npx wrangler kv namespace create MERCHANT_CACHE
# (or dashboard: Storage & Databases -> KV) and paste its id below.
[[kv_namespaces]]
binding = "MERCHANT_CACHE"
id = "ecce561dbee546d097405fd8531d43ca"

# Static frontend: the same Worker serves web/ and the API from one origin.
# web/index.html is generated — edit site/v2-template.html and run
# scripts/build_web.py, never the built file.
[assets]
directory = "../web"
binding = "ASSETS"

# Workers AI: query embeddings for the vector candidate tier
[ai]
binding = "AI"

# Product analytics event store — COMMENTED OUT UNTIL THE DATABASE EXISTS.
# A binding with an unknown database_id fails the deploy, and this Worker
# deploys on git push, so it stays off until these three steps are done:
#   1. npx wrangler d1 create cf_analytics
#   2. npx wrangler d1 execute cf_analytics --remote --file schema.sql
#   3. paste the id below and uncomment this block
# Until then /api/e accepts events and drops them (the Worker writes to
# whichever sinks are bound), so the site runs fine with analytics dark.
#
# D1 over Analytics Engine as the primary sink: real SQL, no sampling, and no
# 90-day retention cliff, which matters more than write throughput at this
# scale. Query straight into a notebook with:
#   npx wrangler d1 execute cf_analytics --remote --json --command "SELECT ..."
# [[d1_databases]]
# binding = "DB"
# database_name = "cf_analytics"
# database_id = "PASTE_THE_ID_FROM_STEP_1"

# Analytics Engine mirror — uncomment to turn on. The Worker writes to whichever
# sinks are bound, so this is the entire migration if D1's row-write budget ever
# becomes the constraint. Caveat when querying AE: it samples at volume, so the
# event count is SUM(_sample_interval), never COUNT(*).
# [[analytics_engine_datasets]]
# binding = "AE"
# dataset = "cf_events"

# Persistent request logs (dashboard: Worker -> Logs). Free tier is ample.
[observability]
enabled = true

[vars]
# Origin allowed to call this API cross-origin (belt-and-suspenders; the
# frontend will be same-origin once assets are enabled)
ALLOWED_ORIGIN = "https://carbon.outis.cc"
CLASSIFY_MODEL = "claude-haiku-4-5"
DAILY_IP_LIMIT = "20"
# Account-wide ceiling on merchants sent to the LLM per day. DAILY_IP_LIMIT
# bounds one visitor; this bounds the bill on a day that goes unexpectedly
# well (or badly). Roughly: 20k merchants/day is single-digit dollars on Haiku.
DAILY_LLM_BUDGET = "20000"

# Secrets (set via dashboard or `npx wrangler secret put <NAME>`):
#   ANTHROPIC_API_KEY   — console.anthropic.com
#   ANALYTICS_SALT      — any long random string; rotating it breaks the link
#                         between past and future visitor hashes, by design
#   TURNSTILE_SECRET    — optional; until it is set the Worker accepts uploads
#                         without a token and the frontend renders no widget
