[project]
name = "carbon-footprint"
version = "0.1.0"
description = "Aggregate Monarch Money transactions into CoolClimate calculator Goods & Services inputs"
requires-python = ">=3.10"
dependencies = [
    "monarchmoney-enhanced",
    "pyyaml",
    # scripts/build_web.py parses the generated app JavaScript before writing
    # it; without this the build degrades to counting brackets.
    "esprima",
]

[project.scripts]
cf = "cf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
